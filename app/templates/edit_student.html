<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2 class="logo-text">

            Deployed By Fardin

        </h2>

        <ul>

            <li>
                <a href="/">Dashboard</a>
            </li>

            <li>
                <a href="/students">Students</a>
            </li>
            <li>
    <a href="/attendance">Attendance</a>
</li>
<li>
    <a href="/results">Results</a>
</li>

            <li>
                <a href="/trash">Trash</a>
            </li>

            <li>
                <a href="/logout">Logout</a>
            </li>

        </ul>

    </div>


    <!-- Main Content -->

    <div class="main-content">

        <!-- Navbar -->

        <div class="navbar">

            <h1 class="main-title">

                Edit Student

            </h1>

        </div>


        <!-- Edit Card -->

        <div class="edit-card">

            <!-- Edit Form -->

            <form
                method="POST"
                enctype="multipart/form-data"
                class="student-form"
            >

                <!-- Student ID -->

                <input
                    type="text"
                    name="student_id"
                    value="{{ student.student_id }}"
                    placeholder="Student ID"
                    required
                >

                <!-- First Name -->

                <input
                    type="text"
                    name="first_name"
                    value="{{ student.first_name }}"
                    placeholder="First Name"
                    required
                >

                <!-- Last Name -->

                <input
                    type="text"
                    name="last_name"
                    value="{{ student.last_name }}"
                    placeholder="Last Name"
                    required
                >

                <!-- Gender -->

                <input
                    type="text"
                    name="gender"
                    value="{{ student.gender }}"
                    placeholder="Gender"
                >

                <!-- Email -->

                <input
                    type="email"
                    name="email"
                    value="{{ student.email }}"
                    placeholder="Email"
                    required
                >

                <!-- Phone -->

                <input
                    type="text"
                    name="phone"
                    value="{{ student.phone }}"
                    placeholder="Phone Number"
                >

                <!-- Course -->

                <input
                    type="text"
                    name="course"
                    value="{{ student.course }}"
                    placeholder="Course"
                >

                <!-- Department -->

                <input
                    type="text"
                    name="department"
                    value="{{ student.department }}"
                    placeholder="Department"
                >

                <!-- Year -->

                <input
                    type="text"
                    name="year_of_study"
                    value="{{ student.year_of_study }}"
                    placeholder="Year Of Study"
                >

                <!-- Admission Date -->

                <input
                    type="date"
                    name="admission_date"
                    value="{{ student.admission_date }}"
                >


                <!-- =========================
                     CURRENT PROFILE IMAGE
                ========================= -->

                <div class="current-image-box">

                    <p class="image-label">

                        Current Profile Picture

                    </p>

                    {% if student.profile_image %}

                        <img
                            src="{{ url_for('static', filename='uploads/' + student.profile_image) }}"
                            alt="Profile Image"
                            class="edit-profile-image"
                        >

                    {% else %}

                        <p class="no-image-text">

                            No Profile Image Uploaded

                        </p>

                    {% endif %}

                </div>


                <!-- =========================
                     NEW PROFILE IMAGE
                ========================= -->

                <input
                    type="file"
                    name="profile_image"
                    class="file-input"
                >


                <!-- =========================
                     BUTTONS
                ========================= -->

                <div class="edit-buttons">

                    <!-- Update -->

                    <button
                        type="submit"
                        class="update-btn"
                    >

                        Update Student

                    </button>


                    <!-- Cancel -->

                    <a
                        href="/students"
                        class="cancel-btn"
                    >

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
